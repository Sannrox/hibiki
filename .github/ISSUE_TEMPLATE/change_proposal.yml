name: Change proposal
description: Propose a focused improvement or discuss behavior before implementation
title: "[Proposal]: "
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete user, operator, or contributor problem needs solving?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing implementation.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: ADR impact
      description: Does this alter product ownership, safety, evidence, or learning semantics?
      options:
        - No; it fits the accepted decisions
        - Yes; it needs an ADR amendment
        - Unsure; maintainer review needed
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and alternatives
      description: Link relevant code, tests, ADRs, or prior discussion and note alternatives.
  - type: textarea
    id: scope
    attributes:
      label: Smallest useful slice
      description: What is the narrowest deterministic change that proves the outcome?
    validations:
      required: true
