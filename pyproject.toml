[project]
name = "hibiki"
version = "0.1.0"
description = "A grounded, approval-gated content workflow coordinator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
]
dependencies = [
    "grpcio>=1.81.1,<2",
    "grpcio-health-checking>=1.81.1,<2",
    "linkify-it-py>=2,<3",
    "protobuf>=6.33.5,<7",
    "setuptools>=83.0.0,<84",
    "twitter-text-parser==3.0.0",
]

[project.urls]
Homepage = "https://github.com/Sannrox/hibiki"
Documentation = "https://github.com/Sannrox/hibiki/tree/main/docs"
Issues = "https://github.com/Sannrox/hibiki/issues"
Repository = "https://github.com/Sannrox/hibiki.git"

[project.scripts]
hibiki = "hibiki.cli:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.81.1,<2",
    "pytest>=8.4,<9",
    "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hibiki"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/hibiki/contracts"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
