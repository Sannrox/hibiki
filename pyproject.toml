[project]
name = "hibiki"
version = "0.1.0"
description = "A grounded, approval-gated content workflow coordinator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.81.1,<2",
    "grpcio-health-checking>=1.81.1,<2",
    "protobuf>=6.33.5,<7",
]

[project.scripts]
hibiki = "hibiki.cli:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.81.1,<2",
    "pytest>=8.4,<9",
    "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hibiki"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/hibiki/contracts"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
